<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <!--
    Lámina de la portada, de serie.

    Es un provisional decente, no arte definitivo: luz de brasa sobre la mesa,
    con los colores de la paleta. Está para que la portada se vea terminada
    mientras no haya foto y para que se pueda juzgar el contraste del titular
    sobre una imagen real.

    Para cambiarla, sustituye este fichero por tu foto. Ver docs/marca.md.
  -->
  <defs>
    <radialGradient id="brasa" cx="22%" cy="78%" r="62%">
      <stop offset="0%" stop-color="#e2622a" stop-opacity="0.55" />
      <stop offset="55%" stop-color="#c9531d" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#17120e" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="candil" cx="82%" cy="18%" r="52%">
      <stop offset="0%" stop-color="#c9973f" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#17120e" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d1611" />
      <stop offset="100%" stop-color="#130f0b" />
    </linearGradient>

    <radialGradient id="vineta" cx="50%" cy="50%" r="72%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55" />
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#fondo)" />
  <rect width="1600" height="900" fill="url(#candil)" />
  <rect width="1600" height="900" fill="url(#brasa)" />

  <!-- Dados dispersos, apenas insinuados: textura, no ilustración. -->
  <g fill="none" stroke="#f5ece2" stroke-opacity="0.07" stroke-width="3" stroke-linejoin="round">
    <path d="M1240 610l104 60v120l-104 60-104-60V670z" />
    <path d="M1240 668l58 104h-116z" stroke-opacity="0.05" />
    <path d="M300 180l70 40v80l-70 40-70-40v-80z" stroke-opacity="0.05" />
    <path d="M980 120l46 27v53l-46 27-46-27v-53z" stroke-opacity="0.04" />
    <path d="M620 700l40 23v46l-40 23-40-23v-46z" stroke-opacity="0.045" />
  </g>

  <rect width="1600" height="900" fill="url(#vineta)" />
</svg>
